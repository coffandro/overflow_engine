<!doctype html>
<html lang="EN-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Overflow Engine</title>

    <style>
        body {
            margin: 0px;
            overflow: hidden;
            background-color: black;
        }

        canvas.emscripten {
            border: 0px none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100dvw;
            height: 100dvh;
            background-color: black;
        }
    </style>
    <script type='text/javascript'
        src="https://cdn.jsdelivr.net/gh/eligrey/FileSaver.js/dist/FileSaver.min.js"> </script>
    <script type='text/javascript'>
        function saveFileFromMEMFSToDisk(memoryFSname, localFSname)     // This can be called by C/C++ code
        {
            var isSafari = false; // Not supported, navigator.userAgent access is being restricted
            //var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            var data = FS.readFile(memoryFSname);
            var blob;

            if (isSafari) blob = new Blob([data.buffer], { type: "application/octet-stream" });
            else blob = new Blob([data.buffer], { type: "application/octet-binary" });

            // NOTE: SaveAsDialog is a browser setting. For example, in Google Chrome,
            // in Settings/Advanced/Downloads section you have a setting:
            // 'Ask where to save each file before downloading' - which you can set true/false.
            // If you enable this setting it would always ask you and bring the SaveAsDialog
            saveAs(blob, localFSname);

            // Alternative implementation to avoid FileSaver.js
            //const link = document.createElement("a");
            //link.href = URL.createObjectURL(blob);
            //link.download = localFSname;
            //link.click();
        }
    </script>
</head>

<body>
    <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>
    <p id="output" />
    <script>
        function ResizeEngineToCanvas() {
            if (!canvas || window.setEngineDimensions == null) return;

            let width = canvas.clientWidth;
            let height = canvas.clientHeight;

            window.setEngineDimensions(width, height);
        }
        var canvas = document.getElementById('canvas');

        var Module = {
            print: (function () {
                var element = document.getElementById('output');
                if (element) element.value = ''; // clear browser cache
                return function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (element) {
                        element.value += text + "\n";
                        element.scrollTop = element.scrollHeight; // focus on bottom
                    }
                };
            })(),
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                return canvas;
            })(),
            onRuntimeInitialized: function () {
                window.setEngineDimensions = Module.cwrap("set_dimensions", "void", ["int", "int"]);

                window.addEventListener("resize", ResizeEngineToCanvas);
                ResizeEngineToCanvas();
            }
        };
    </script>
    {{{ SCRIPT }}}
</body>

</html>
